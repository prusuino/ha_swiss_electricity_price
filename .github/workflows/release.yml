name: Release asset

# Attaches a zip of the integration folder to every published release.
# HACS downloads this file (hacs.json: zip_release + filename), and GitHub
# counts the asset downloads, which HACS shows as the download number.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build elcom_tariffs.zip (integration files at the archive root)
        run: |
          cd custom_components/elcom_tariffs
          zip -r ../../elcom_tariffs.zip . -x '*/__pycache__/*' '*.pyc'
          cd ../..
          unzip -l elcom_tariffs.zip | head -20

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" elcom_tariffs.zip --clobber
